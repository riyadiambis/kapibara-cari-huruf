<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Kapibara Cari Huruf - Game Edukasi Membaca</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="game-container">
    <!-- TOP BAR -->
    <header id="top-bar">
      <div class="status-row">
        <span>🐾 KAPIBARA</span>
        <span id="level-indicator">Kata 1 dari 15</span>
      </div>
      <div class="word-target-title">
        BENTUK KATA: 
        <span id="word-emoji" class="target-emoji">🐄</span> 
        <span id="current-target-name" class="target-text">SAPI</span>
      </div>
      <div class="slots-container" id="slots-container">
        <div class="letter-slot" id="slot-0"></div>
        <div class="letter-slot" id="slot-1"></div>
        <div class="letter-slot" id="slot-2"></div>
        <div class="letter-slot" id="slot-3"></div>
      </div>
    </header>

    <!-- GAME CANVAS -->
    <main id="canvas-wrapper">
      <canvas id="gameCanvas"></canvas>
    </main>

    <!-- TOUCH CONTROLLER & DESKTOP HINT -->
    <footer id="controls-bar">
      <div class="desktop-hint" id="desktop-hint">
        🎮 Pakai tombol <b>Panah (Arrow Keys)</b> atau <b>WASD</b> di keyboard untuk berjalan
      </div>
      <div class="dpad-container" id="dpad-container">
        <button class="dpad-btn" id="btn-up" aria-label="Atas">▲</button>
        <button class="dpad-btn" id="btn-left" aria-label="Kiri">◀</button>
        <button class="dpad-btn" id="btn-down" aria-label="Bawah">▼</button>
        <button class="dpad-btn" id="btn-right" aria-label="Kanan">▶</button>
      </div>
    </footer>

    <!-- POPUP MODAL SETELAH KATA SELESAI -->
    <div id="word-complete-modal" class="popup-backdrop hidden">
      <div class="popup-card">
        <div id="popup-emoji" class="popup-card-emoji">🐄</div>
        <div id="popup-word" class="popup-card-word">SAPI</div>
        <div class="popup-buttons-col">
          <button id="btn-replay-sound" class="popup-action-btn btn-replay" aria-label="Dengar Lagi">
            🔊 DENGAR LAGI
          </button>
          <button id="btn-next-word" class="popup-action-btn btn-next" aria-label="Lanjut">
            LANJUT ▶
          </button>
        </div>
      </div>
    </div>

    <!-- START SCREEN OVERLAY -->
    <div id="start-overlay" class="overlay-screen">
      <div class="overlay-emoji">🐹🍊</div>
      <h1 class="overlay-title">KAPIBARA<br>CARI HURUF</h1>
      <p class="overlay-subtitle">Ayo bantu Kapibara mencari huruf-huruf untuk menyusun kata!</p>
      <button id="start-btn" class="big-action-btn">▶ MULAI</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
