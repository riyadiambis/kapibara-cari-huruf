<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Kapibara Cari Huruf - Game Edukasi Membaca</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="game-container">
    <!-- TOP BAR -->
    <header id="top-bar">
      <div class="status-row">
        <span>🐾 KAPIBARA</span>
        <span id="level-indicator">Kata 1 dari 15</span>
      </div>
      <div class="word-target-title">BENTUK KATA: <span id="current-target-name" style="color:#9e2a2b; font-weight:900;">...</span></div>
      <div class="slots-container" id="slots-container">
        <div class="letter-slot" id="slot-0"></div>
        <div class="letter-slot" id="slot-1"></div>
        <div class="letter-slot" id="slot-2"></div>
        <div class="letter-slot" id="slot-3"></div>
      </div>
    </header>

    <!-- GAME CANVAS -->
    <main id="canvas-wrapper">
      <canvas id="gameCanvas" width="480" height="420"></canvas>
    </main>

    <!-- TOUCH CONTROLLER -->
    <footer id="controls-bar">
      <div class="dpad-container">
        <button class="dpad-btn" id="btn-up" aria-label="Atas">▲</button>
        <button class="dpad-btn" id="btn-left" aria-label="Kiri">◀</button>
        <button class="dpad-btn" id="btn-down" aria-label="Bawah">▼</button>
        <button class="dpad-btn" id="btn-right" aria-label="Kanan">▶</button>
      </div>
    </footer>

    <!-- START SCREEN OVERLAY -->
    <div id="start-overlay" class="overlay-screen">
      <div style="font-size: 56px; margin-bottom: 8px;">🐹🍊</div>
      <h1 class="overlay-title">KAPIBARA<br>CARI HURUF</h1>
      <p class="overlay-subtitle">Ayo bantu Kapibara mencari huruf-huruf untuk menyusun kata!</p>
      <button id="start-btn" class="big-action-btn">▶ MULAI</button>
    </div>

    <!-- VICTORY SCREEN OVERLAY -->
    <div id="victory-overlay" class="overlay-screen hidden">
      <div style="font-size: 60px; margin-bottom: 8px;">👑🎉</div>
      <h2 class="overlay-title">HEBAT SEKALI!</h2>
      <p class="overlay-subtitle">Kamu berhasil membaca semua 15 kata dengan pintar!</p>
      <button id="restart-btn" class="big-action-btn">🔄 MAIN LAGI</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
